<script>
    //overlay
    $("#modal").modal({
        closeClass: ".close",
        top: 0
    })

    $(function () {
        $.ajaxSetup({ cache: false });
        $("#agree-btn").click(function () {
            var strUrl = new String();
                  strUrl += "downloadfileajax.aspx?";
                  strUrl += "c=" + getUrlVars()["c"];


                  strUrl += "&lang=" + getUrlVars()["lang"];
                  strUrl += "&dlid=" + getUrlVars()["dlid"];

               if (getUrlVars()["disconos"] == null) {            
                  if (getUrlVars()["flang"] != null) {
                    strUrl += "&flang=" + getUrlVars()["flang"];
                  }
                }
                else
                {
                	strUrl  += "&flang=" + getUrlVars()["flang"];
                    strUrl  += "&disconos=" + getUrlVars()["disconos"];
                    strUrl  += "&prod=" + getUrlVars()["prod"];
                    strUrl  += "&os=" + getUrlVars()["os"];
                }                	
            
            getFilePath(strUrl);
        });

        $("a[name='agree_layer']").click(function () {
            var strUrl = new String();

            strUrl += "downloadfileajax.aspx?";
            strUrl += "c=" + getUrlVars()["c"];
            strUrl += "&lang=" + getUrlVars()["lang"];
            strUrl += "&dlid=" + getUrlVars()["dlid"];
            strUrl += "&flang=" + this.id;

            getFilePath(strUrl);
        });
    });

    function getFilePath(strUrl) {
        $.get(
            strUrl, // AjaxAccessURL
            function (data, status, XHR) {
                var filePath = replaceHTMLTag(data);
                
                if (!filePath.match(/error\.aspx/g)) {
                  window.dataLayer = window.dataLayer || [];
                  dataLayer.push({ "event" : "Agreement" , "AgreeURL" : filePath } );
                }
                setTimeout(function () {
                    location.href = filePath;
                }, 1000);
            }
        );
    }

    function getUrlVars() {
        var vars = [], hash;
        var hashes = window.location.href.slice(window.location.href.indexOf('?') + 1).split('&');
        for (var i = 0; i < hashes.length; i++) {
            hash = hashes[i].split('=');
            var key = hash[0].toLowerCase();
            vars.push(key);
            vars[key] = hash[1].split('#')[0];
        }
        return vars;
    }

    function replaceHTMLTag(searchText) {
        var re = /<\S[^><]*>/g
        return jQuery.trim(searchText.replace(re, ""))
    }
</script>
