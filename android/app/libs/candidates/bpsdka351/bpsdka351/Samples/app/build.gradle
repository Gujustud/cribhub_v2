apply plugin: 'com.android.application'

android {
    compileSdkVersion 29
    defaultConfig {
        applicationId "com.brother.ptouch.sdk.printdemo"
        minSdkVersion 14
        targetSdkVersion 29

        versionName '3.5.1'
        versionCode 74
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }
    productFlavors {
    }
}

repositories {
    flatDir {
        dirs '../../libs'
    }
}

dependencies {
    implementation(name: 'BrotherPrintLibrary', ext: 'aar')
}
